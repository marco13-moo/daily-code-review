name: Daily code review

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze eligible pull requests without submitting reviews
        required: true
        type: boolean
        default: true

# The repository token only checks out this repository. Cross-repository review
# access is supplied through a separately scoped secret at the step boundary.
permissions:
  contents: read

concurrency:
  group: daily-code-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify reviewer
        run: npm test

      - name: Analyze pull requests
        run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.GH_REVIEW_TOKEN }}
          REVIEW_REPOSITORIES: ${{ vars.REVIEW_REPOSITORIES }}
          # Scheduled runs submit actionable findings. Manual runs are safe by
          # default and require an explicit dry-run opt-out before posting.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
